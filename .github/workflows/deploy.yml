name: Deploy Emulators

on:
  push:
    branches: [ main, master ]
    paths:
      - 'emulators/public/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: emulators/public/
          target: /home/sselenso/emulators
          strip_components: 2
      
      - name: Set permissions
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "📁 Проверяем файлы на сервере:"
            ls -la /home/sselenso/emulators/public/
            
            # Проверяем наличие index.html
            if [ -f "/home/sselenso/emulators/public/index.html" ]; then
              echo "✅ index.html найден!"
            else
              echo "❌ index.html НЕ НАЙДЕН!"
              exit 1
            fi
            
            # Устанавливаем права
            sudo chown -R www-data:www-data /home/sselenso/emulators/public || true
            sudo chmod -R 755 /home/sselenso/emulators/public || true
            
            echo ""
            echo "=========================================="
            echo "✅ Деплой emulators.familyarh.com завершен!"
            echo "🌐 Сайт: https://emulators.familyarh.com"
            echo "=========================================="