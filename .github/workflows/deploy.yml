name: Deploy Emulators to VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: public/
          target: /home/sselenso/emulators/
          overwrite: true
      
      - name: Set permissions
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "📁 Проверяем файлы на сервере:"
            ls -la /home/sselenso/emulators/public/
            
            # Устанавливаем права для Nginx
            sudo chown -R www-data:www-data /home/sselenso/emulators/public
            sudo chmod -R 755 /home/sselenso/emulators/public
            
            echo ""
            echo "✅ Деплой завершен!"
            echo "🌐 Сайт: https://emulators.familyarh.com"