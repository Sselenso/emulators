name: Deploy Emulators to VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "index.html,digma.html,cudy.html,data.json,favicon.ico,assets,mobile,router-admin"
          target: /home/sselenso/emulators/public
          overwrite: true
          rm: true
      
      - name: Set permissions
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            sudo chown -R www-data:www-data /home/sselenso/emulators/public
            sudo chmod -R 755 /home/sselenso/emulators/public
            echo "✅ Деплой завершен!"
            echo "📁 Файлы:"
            ls -la /home/sselenso/emulators/public/